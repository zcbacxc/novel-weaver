name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package (dev)
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint check
        run: ruff check src/

      - name: Mypy type check
        run: mypy src/novel_weaver

  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package (dev)
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -v

      # Enforced on the 3.12 leg only to avoid redundant coverage collection.
      # Keep --cov-fail-under in sync with [tool.coverage.report] fail_under.
      - name: Coverage gate (3.12)
        if: matrix.python-version == '3.12'
        run: >
          python -m pytest tests -q
          --cov=novel_weaver
          --cov-report=term
          --cov-fail-under=78

      - name: Verify CLI entry point
        run: novel-weaver --help

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

  # Summary job — name "test" matches branch protection required check.
  # Matrix jobs generate "test-matrix (3.12)" etc. which don't match.
  test:
    needs: [lint, test-matrix, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test-matrix.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]; then
            echo "lint, test-matrix, and build passed"
          else
            echo "lint: ${{ needs.lint.result }}, test-matrix: ${{ needs.test-matrix.result }}, build: ${{ needs.build.result }}"
            exit 1
          fi
