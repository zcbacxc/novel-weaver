name: Verify PyPI Trusted Publishing

# One-shot check: mint a PyPI OIDC token and see if the publisher is registered.
# Does not upload any distribution.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint PyPI OIDC token
        id: mint
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi.org" \
            -o /tmp/idt.json
          python3 - <<'PY'
          import json, sys, urllib.error, urllib.request
          from pathlib import Path

          idt = json.loads(Path("/tmp/idt.json").read_text())
          token = idt.get("value") or ""
          print(f"oidc_jwt_chars={len(token)}")
          if not token:
              print("No OIDC JWT minted from GitHub.", file=sys.stderr)
              sys.exit(1)

          # Decode payload (no verify) for diagnostics only — do not print signature.
          import base64
          parts = token.split(".")
          if len(parts) >= 2:
              pad = "=" * (-len(parts[1]) % 4)
              claims = json.loads(base64.urlsafe_b64decode(parts[1] + pad))
              for k in ("iss", "sub", "repository", "repository_owner", "workflow", "ref", "aud", "exp"):
                  if k in claims:
                      print(f"claim.{k}={claims[k]}")

          Path("/tmp/oidc_token_only.txt").write_text(token)
          print("wrote /tmp/oidc_token_only.txt")
          PY
          # Mint via curl (same shape as pypa/gh-action-pypi-publish)
          RESP=$(curl -sS -o /tmp/pypi_mint.json -w '%{http_code}' \
            -X POST https://pypi.org/_/oidc/mint-token \
            -H 'Content-Type: application/json' \
            --data-binary @<(python3 -c 'import json,pathlib; print(json.dumps({"token": pathlib.Path("/tmp/oidc_token_only.txt").read_text().strip()}))')
          )
          echo "http_code=$RESP"
          cat /tmp/pypi_mint.json || true
          echo
          if [ "$RESP" = "200" ]; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "Trusted Publisher is recognized by PyPI."
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "Trusted Publisher NOT recognized / token rejected."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### OIDC verify" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: ${{ steps.mint.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
