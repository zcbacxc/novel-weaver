name: Verify PyPI Trusted Publishing

# One-shot check: mint a PyPI OIDC token and see if the publisher is registered.
# Does not upload any distribution.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint PyPI OIDC token
        id: mint
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi.org" \
            -o /tmp/idt.json
          python3 - <<'PY'
          import json, sys, urllib.error, urllib.request
          from pathlib import Path

          idt = json.loads(Path("/tmp/idt.json").read_text())
          token = idt.get("value") or ""
          print(f"oidc_jwt_chars={len(token)}")
          if not token:
              print("No OIDC JWT minted from GitHub.", file=sys.stderr)
              sys.exit(1)

          # Decode payload (no verify) for diagnostics only — do not print signature.
          import base64
          parts = token.split(".")
          if len(parts) >= 2:
              pad = "=" * (-len(parts[1]) % 4)
              claims = json.loads(base64.urlsafe_b64decode(parts[1] + pad))
              for k in ("sub", "repository", "repository_owner", "workflow", "ref", "aud"):
                  if k in claims:
                      print(f"claim.{k}={claims[k]}")

          body = json.dumps({"token": token}).encode()
          req = urllib.request.Request(
              "https://pypi.org/_/oidc/mint-token",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = resp.read().decode()
                  print(f"http_code={resp.status}")
                  print(payload[:500])
                  Path("/tmp/mint_result.txt").write_text("ok")
          except urllib.error.HTTPError as e:
              err = e.read().decode(errors="replace")
              print(f"http_code={e.code}")
              print(err[:800])
              Path("/tmp/mint_result.txt").write_text("fail")
              sys.exit(1)
          PY
          result=$(cat /tmp/mint_result.txt)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "ok" ]; then
            echo "Trusted Publisher is recognized by PyPI."
          else
            echo "Trusted Publisher NOT recognized."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### OIDC verify" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: ${{ steps.mint.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
