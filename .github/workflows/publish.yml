name: Publish to PyPI

# Fires on version tags only. Configure Trusted Publishing on pypi.org
# (and test.pypi.org) before the first automated release:
#   Owner: zcbacxc  Repo: novel-weaver  Workflow: publish.yml
# skip-existing keeps re-runs safe if a version was already uploaded manually.

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Determine publish target
        id: determine_target
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *"-test" || "$TAG" == *"-rc."* ]]; then
            echo "target=testpypi" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "target=pypi" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Publish to ${{ steps.determine_target.outputs.target }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          repository-url: ${{ steps.determine_target.outputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          TAG_VERSION="${{ steps.determine_target.outputs.tag }}"
          python3 -c "
          import re
          with open('CHANGELOG.md') as f:
              content = f.read()
          ver = '${TAG_VERSION}'.lstrip('v').split('-')[0]
          pattern = r'## \[' + re.escape(ver) + r'\](.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, content, re.DOTALL)
          if m:
              lines = m.group(1).strip().split('\n', 1)
              body = lines[1] if len(lines) > 1 else lines[0]
              with open('/tmp/release_notes.md', 'w') as out:
                  out.write(body.strip() + '\n')
          else:
              with open('/tmp/release_notes.md', 'w') as out:
                  out.write('Release ${TAG_VERSION}\n')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ steps.determine_target.outputs.is_prerelease }}
