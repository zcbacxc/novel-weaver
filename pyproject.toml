[build-system]
# setuptools>=77 for PEP 639 license expression support
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-weaver"
version = "0.1.0"
description = "AI long-form novel production core engine: continuous, recoverable, incremental chapter generation with a strict Canonical Story truth boundary."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "zcbacxc", email = "zcbacxc@users.noreply.github.com" },
]
keywords = [
    "novel",
    "long-form",
    "ai-writing",
    "story-engine",
    "canonical-story",
    "llm",
    "production-pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing",
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/zcbacxc/novel-weaver"
Repository = "https://github.com/zcbacxc/novel-weaver"
Issues = "https://github.com/zcbacxc/novel-weaver/issues"
Changelog = "https://github.com/zcbacxc/novel-weaver/blob/main/CHANGELOG.md"

[project.scripts]
novel-weaver = "novel_weaver.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "BLE", "A"]
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
follow_imports = "skip"
files = ["src/novel_weaver"]

[tool.coverage.run]
source = ["novel_weaver"]

[tool.coverage.report]
# Keep in sync with the CI coverage-gate CLI flag.
fail_under = 78
